# Staging stack: PostgreSQL + Plant-Doctor backend + Caddy (auto-TLS).
# Build on the EC2 host (amd64) so sharp's native binary matches the runtime.
#
# Variables referenced as ${VAR} are read from a .env file in this directory
# (see .env.staging.example). Copy it to .env on the server and fill it in.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to the host; only the backend/migrate containers reach it.

  # One-shot: applies committed Drizzle migrations, then exits. drizzle-kit is a
  # devDependency, so this runs from the builder stage which has the full deps.
  migrate:
    build:
      context: .
      target: builder
    working_dir: /app
    command: npx drizzle-kit migrate --config=libs/db/drizzle.config.ts
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    env_file: .env
    environment:
      # Override the .env value so the backend always targets the db container.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "4100"
    # No host port — Caddy fronts it. Uncomment to debug from the host:
    # ports:
    #   - "4100:4100"
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config: