[tool.coverage.run]
branch = true
source = [ "src" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/backend-py/html'
 --cov-report xml:'../../coverage/apps/backend-py/coverage.xml'
 --html='../../reports/apps/backend-py/unittests/html/index.html'
 --junitxml='../../reports/apps/backend-py/unittests/junit.xml'
"""

[project]
name = "backend-py"
version = "1.0.0"
description = "Plant Doctor Python API"
requires-python = ">=3.11,<3.14"
readme = 'README.md'
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pillow>=11.0.0",
    "numpy>=1.26.0,<2",
    "open-clip-torch>=2.24.0",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "python-dotenv>=1.2.2",
]


[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
